# 生产部署编排（CI Release 产物）
# 原则：数据库与 Redis 只在内网，不映射到宿主机；仅 Nginx 暴露 80/443。
# 镜像由 tag 触发的 release workflow 构建并推送；此处只接受 digest-pinned image，
# 禁止本地 build。使用：docker compose ... up -d --no-build

name: geo-prod

# 日志：所有服务统一 json-file 轮转，单文件 10MB、保留 3 份，避免容器日志写满磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *default-logging
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
    # 生产不暴露端口，只允许容器网络内访问

  redis:
    logging: *default-logging
    image: redis:7
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # 一次性任务：建表 + 基础种子 + 15 平台目录 + 4 个扩展 API 入口。
  # 平台目录和 API 入口都是幂等脚本；API 入口默认停用，不参与 24 格。
  migrate:
    logging: *default-logging
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    pull_policy: always
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed.py && python scripts/seed_platform_catalog.py --apply && python scripts/seed_platform_api_entries.py --apply"]
    restart: "no"
    env_file:
      - ./.env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  api:
    logging: *default-logging
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    pull_policy: always
    restart: always
    env_file:
      - ./.env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # 本栈由 services.nginx 单层前置并回填 X-Real-IP / X-Forwarded-For。
      # 必须为 1：否则后端只能看到 nginx 容器地址，按 IP 的登录限流与公开接口限流
      # 会退化成「全站共享一个桶」，正常访客会在额度用尽后被一起挡掉。
      TRUSTED_PROXY_COUNT: 1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    expose:
      - "8000"
    volumes:
      - evidence_data:/app/var/evidence

  worker:
    logging: *default-logging
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    pull_policy: always
    restart: always
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    env_file:
      - ./.env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    volumes:
      - evidence_data:/app/var/evidence
    healthcheck:
      test: ["CMD", "python", "scripts/worker_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 定时调度：outbox 派发（30s）+ 监测轮次扫描（300s）。必须与 worker 分离，
  # 且全局只允许一个实例（多副本会重复投递定时任务）。
  beat:
    logging: *default-logging
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    pull_policy: always
    restart: always
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    env_file:
      - ./.env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "scripts/beat_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    logging: *default-logging
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    pull_policy: always
    restart: always
    environment:
      NODE_ENV: production
      # 服务端 BFF 读取的真实后端地址；容器网络内固定为 compose 服务名。
      GEO_API_URL: http://api:8000
    networks:
      - internal
    expose:
      - "3000"

  nginx:
    logging: *default-logging
    image: nginx:1.27
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/geo.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    networks:
      - internal

volumes:
  pgdata:
  redisdata:
  evidence_data:

networks:
  internal:
    driver: bridge
