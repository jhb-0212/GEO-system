# GEO 系统生产 Nginx 配置
# 只放行 80/443；HTTP 全量跳 HTTPS；API 反代到 api:8000，其余到 frontend:3000
# 公开站子域上线时，把 server_name 的 geo.example.com 替换为 geo.gdccai.com；
# frontend:3000 根路径已是公开站，/login 与 /workbench 仍是内部工作台。

server {
    listen 80;
    server_name geo.example.com;
    # 仅用于 ACME 校验，其余一律跳转
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name geo.example.com;

    # 用 Docker 内置 DNS 在请求时解析上游，容器重建换 IP 后无需重启 nginx
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8000;
    set $frontend_upstream http://frontend:3000;

    # 证书由运维放入 deploy/nginx/certs（不提交仓库）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 后端 API
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 健康检查与文档（可按需收紧来源）
    location /health {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        access_log off;
    }
    location /docs {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    # 异步进度的长连接（SSE）不能开缓冲
    location /api/v1/stream/ {
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 前端
    location / {
        proxy_pass $frontend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
