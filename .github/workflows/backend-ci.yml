name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo_ci_pass
          POSTGRES_DB: geo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geo -d geo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgresql+psycopg://geo:geo_ci_pass@127.0.0.1:5432/geo_test
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      TASK_ALERT_WEBHOOK: ""

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Migrate empty database
        run: python -m alembic upgrade head

      - name: Seed baseline data
        working-directory: backend
        run: python scripts/seed.py

      - name: Run tests with coverage
        working-directory: backend
        run: python -m pytest tests -q --cov=app --cov-report=term-missing --cov-fail-under=89

      - name: OpenAPI drift check
        working-directory: backend
        run: |
          if [ -f scripts/export_openapi.py ]; then
            python scripts/export_openapi.py --check
          else
            echo "export_openapi.py not present on this branch; skipped"
          fi

      - name: Fresh database migration check
        working-directory: backend
        run: |
          if [ -f scripts/check_fresh_migration.py ]; then
            python scripts/check_fresh_migration.py
          else
            echo "check_fresh_migration.py not present on this branch; skipped"
          fi
