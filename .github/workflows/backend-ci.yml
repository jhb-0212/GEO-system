name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo_dev
          POSTGRES_DB: geo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U geo -d geo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://geo:geo_dev@localhost:5433/geo
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Verify single migration head
        run: |
          python -m alembic -c alembic.ini heads
          heads=$(python -m alembic -c alembic.ini heads | grep -c '(head)')
          if [ "$heads" -ne 1 ]; then
            echo "检测到 $heads 个迁移头，请补合并迁移（down_revision 指向多个 head）"
            exit 1
          fi

      - name: Migrate database
        run: python -m alembic -c alembic.ini upgrade head

      - name: Verify model/migration parity
        run: python -m alembic -c alembic.ini check

      - name: Seed baseline
        working-directory: backend
        run: python scripts/seed.py

      - name: Check permission drift (code matrix vs database)
        working-directory: backend
        run: python scripts/check_permission_drift.py

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Verify OpenAPI baseline
        working-directory: backend
        run: |
          python - <<'PY'
          import hashlib
          import json

          from app.main import app

          committed = open("../docs/openapi.json", "rb").read()
          generated = (json.dumps(app.openapi(), ensure_ascii=False, indent=2) + "\n").encode("utf-8")
          if committed != generated:
              raise SystemExit("docs/openapi.json 与 app 实时导出不一致，请重导并更新指纹")

          spec = json.loads(committed)
          paths = len(spec.get("paths", {}))
          operations = sum(
              len([m for m in item if m in ("get", "post", "put", "patch", "delete", "head", "options", "trace")])
              for item in spec.get("paths", {}).values()
          )
          schemas = len(spec.get("components", {}).get("schemas", {}))
          if (paths, operations, schemas) != (103, 129, 302):
              raise SystemExit(f"OpenAPI 基线不一致：{paths}/{operations}/{schemas}，期望 103/129/302")

          print(f"OpenAPI identical=True paths={paths} operations={operations} schemas={schemas} sha256={hashlib.sha256(committed).hexdigest().upper()}")
          PY

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate route types
        working-directory: frontend
        run: pnpm exec next typegen

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: frontend
        run: pnpm build
