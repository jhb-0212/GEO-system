name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo_dev
          POSTGRES_DB: geo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U geo -d geo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://geo:geo_dev@localhost:5433/geo
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Check migration immutability (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python backend/scripts/check_migration_immutable.py --event pull_request --comparison merge-base --base "$BASE_SHA"

      - name: Check migration immutability (push)
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: python backend/scripts/check_migration_immutable.py --event push --comparison direct --base "$BEFORE_SHA" --head "$AFTER_SHA"

      - name: Verify single migration head
        run: |
          python -m alembic -c alembic.ini heads
          heads=$(python -m alembic -c alembic.ini heads | grep -c '(head)')
          if [ "$heads" -ne 1 ]; then
            echo "检测到 $heads 个迁移头，请补合并迁移（down_revision 指向多个 head）"
            exit 1
          fi

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migrate database
        run: python -m alembic -c alembic.ini upgrade head

      - name: Verify model/migration parity
        run: python -m alembic -c alembic.ini check

      # 双路径对账：空库全链升级（元数据建表 → R-01 跳过）与旧脚本建表库
      # （R-01 ADD COLUMN）必须结构等价；非法列定义必须让 R-01 失败。
      - name: Verify migration paths (A/B) equivalence
        working-directory: backend
        env:
          GEO_E2E_MIGRATION_PATHS: "1"
        run: python -m pytest -q tests/test_migration_paths_e2e.py

      - name: Seed baseline
        working-directory: backend
        run: python scripts/seed.py

      # C2：DST 与自然日边界矩阵（真实 PostgreSQL 查询，期望 UTC 值硬编码）
      # 必须排在 seed 之后：HTTP 层用例要建项目成员，依赖 seed 写入的 editor 角色
      - name: Verify DST matrix (C2)
        working-directory: backend
        env:
          GEO_C2_DST_MATRIX: "1"
        run: python -m pytest -q tests/test_dst_matrix_e2e.py tests/test_c2_api_timezone_e2e.py tests/test_c2_enter_cycle_e2e.py tests/test_c2_midnight_edges_e2e.py

      - name: Check permission drift (code matrix + permission doc)
        working-directory: backend
        run: python scripts/check_permission_drift.py --doc ../docs/权限矩阵.md

      # 只读检查：CI 不写库、不撤销授权；补齐/撤销只能在部署流程里显式执行
      - name: Check permission sync state (code matrix vs database)
        working-directory: backend
        run: python scripts/sync_permissions.py --check

      - name: Verify schema baseline artifact
        working-directory: backend
        run: python scripts/audit_schema.py --check

      - name: Verify complete schema DDL (target database)
        working-directory: backend
        run: python scripts/check_schema_ddl.py --target "$DATABASE_URL" --pg-dump "$(command -v pg_dump)"

      - name: Verify capability matrix (strict)
        working-directory: backend
        run: python scripts/audit_capability.py --check --strict

      - name: Check current docs baseline
        working-directory: backend
        run: python scripts/check_doc_baseline.py

      - name: Prepare JUnit directory
        run: mkdir -p artifacts

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q --junitxml=../artifacts/backend-junit.xml

      - name: Upload backend JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: artifacts/backend-junit.xml
          retention-days: 7

      - name: Verify OpenAPI baseline
        working-directory: backend
        run: python scripts/export_openapi.py --check

  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate route types
        working-directory: frontend
        run: pnpm exec next typegen

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: pnpm exec eslint .

      - name: Build
        working-directory: frontend
        run: pnpm build

  frontend-e2e-mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend-check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Mock smoke
        working-directory: frontend
        run: pnpm exec playwright test --config=playwright.mock.config.ts

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mock-smoke-artifacts
          path: frontend/test-results
          retention-days: 7
