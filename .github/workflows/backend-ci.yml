name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: geo
          POSTGRES_PASSWORD: geo_dev
          POSTGRES_DB: geo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U geo -d geo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://geo:geo_dev@localhost:5433/geo
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Verify single migration head
        run: |
          python -m alembic -c alembic.ini heads
          heads=$(python -m alembic -c alembic.ini heads | grep -c '(head)')
          if [ "$heads" -ne 1 ]; then
            echo "检测到 $heads 个迁移头，请补合并迁移（down_revision 指向多个 head）"
            exit 1
          fi

      - name: Migrate database
        run: python -m alembic -c alembic.ini upgrade head

      - name: Verify model/migration parity
        run: python -m alembic -c alembic.ini check

      - name: Seed baseline
        working-directory: backend
        run: python scripts/seed.py

      - name: Check permission drift (code matrix vs database)
        working-directory: backend
        run: python scripts/check_permission_drift.py

      - name: Verify schema baseline artifact
        working-directory: backend
        run: python scripts/audit_schema.py --check

      - name: Verify capability matrix (strict)
        working-directory: backend
        run: python scripts/audit_capability.py --check --strict

      - name: Check current docs baseline
        working-directory: backend
        run: python scripts/check_doc_baseline.py

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Verify OpenAPI baseline
        working-directory: backend
        run: python scripts/export_openapi.py --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate route types
        working-directory: frontend
        run: pnpm exec next typegen

      - name: Type check
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: frontend
        run: pnpm build
