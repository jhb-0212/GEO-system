name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      # 版本取自 frontend/package.json 的 packageManager 字段；action 默认读仓库根目录
      # 版本只从 frontend/package.json 的 packageManager 读，不另写 version：
      # pnpm/action-setup 同时看到两处版本会直接报 "Multiple versions of pnpm specified" 并中止（实测踩过）。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typegen
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json

      - name: Lint
        run: pnpm exec eslint components lib app

      - name: Build
        run: pnpm build

  # 冒烟 e2e：mock 模式（GEO_API_MODE=mock），自起 next dev，不依赖后端 / PG / Redis。
  # 真实接口的 e2e 仍在本地按 frontend/e2e/README.md 跑，不进 CI（需要整套后端环境）。
  e2e-mock:
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 同 check job：版本只读 package.json，不另写 version（双版本声明会被 action 拒绝）
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # 冒烟只跑 chromium，省掉 firefox / webkit 的下载时间
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Mock smoke
        run: pnpm exec playwright test --config=playwright.mock.config.ts

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mock-smoke-artifacts
          path: frontend/test-results
          retention-days: 7
